# =============================================================================
# Monitoring wiring for kube-prometheus-stack.
#
# Prerequisites (one-time, cluster-wide):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prom prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
#     --set prometheus.prometheusSpec.ruleSelectorNilUsesHelmValues=false
#
# The monitoring namespace must be labelled so the app NetworkPolicy permits it:
#   kubectl label ns monitoring kubernetes.io/metadata.name=monitoring --overwrite
#
# Secret wiring: the Prometheus scraper authenticates to /metrics with a Bearer
# token. We keep the same token in two places:
#   - mobility-secrets (app namespace) → ADMIN_TOKEN_1 (app accepts as valid)
#   - prometheus-metrics-token (monitoring ns) → consumed by ServiceMonitor
# Both values must be the SAME token. See create-sealed-secret.sh.
# =============================================================================

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mobility-bot
  labels:
    app: mobility-bot
    release: kube-prom   # Matches kube-prometheus-stack default selector
spec:
  namespaceSelector:
    matchNames:
      - default          # Override via kustomize if app is deployed elsewhere
  selector:
    matchLabels:
      app: mobility-bot
      component: api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      scheme: http
      bearerTokenSecret:
        name: prometheus-metrics-token
        key: token

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mobility-bot-alerts
  labels:
    app: mobility-bot
    release: kube-prom
spec:
  groups:
    - name: bot_availability
      rules:
        - alert: BotAPIDown
          expr: up{job="mobility-bot/mobility-bot", service="mobility-api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Bot API is down"
            description: "Bot API has been unreachable for over 1 minute."

    - name: bot_performance
      rules:
        - alert: HighAPILatency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API p95 latency exceeds 10 seconds"
            description: "95th percentile response time: {{ $value }}s"

        - alert: HighLLMLatency
          expr: histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m])) > 15
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "LLM p95 latency exceeds 15 seconds"
            description: "95th percentile LLM call time: {{ $value }}s"

        - alert: HighLLMErrorRate
          expr: rate(llm_requests_total{status=~"error|timeout"}[5m]) / rate(llm_requests_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LLM error rate exceeds 10%"
            description: "Error rate: {{ $value | humanizePercentage }}"

        - alert: LLMCircuitBreakerOpen
          expr: llm_circuit_breaker_open == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "LLM circuit breaker is OPEN - AI unavailable"

        - alert: HighRateLimitHits
          expr: rate(llm_rate_limit_hits_total[5m]) > 0.5
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Frequent LLM rate limit hits"
            description: "Rate: {{ $value }}/s"

    - name: bot_cost
      rules:
        - alert: DailyCostBudgetExceeded
          expr: increase(llm_cost_usd_total[24h]) > 50
          labels:
            severity: warning
          annotations:
            summary: "Daily LLM cost budget exceeded ($50)"
            description: "Current daily cost: ${{ $value | humanize }}"

        - alert: CostSpike
          expr: rate(llm_cost_usd_total[1h]) * 24 > 100
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "LLM cost spike detected - projected >$100/day"
            description: "Projected daily cost: ${{ $value | humanize }}"

    - name: bot_routing
      rules:
        - alert: HighClarifyRate
          expr: |
            (
              rate(routing_clarify_total[1h])
              / on() rate(routing_decisions_total[1h])
            ) > 0.20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Clarify rate >20% in the last hour"
            description: "{{ $value | humanizePercentage }} of routing decisions needed clarification."

        - alert: SustainedHighClarifyRate
          expr: |
            (
              rate(routing_clarify_total[6h])
              / on() rate(routing_decisions_total[6h])
            ) > 0.15
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Sustained clarify rate >15% over 6 hours"
            description: "Potential entity-detection regression — investigate /admin/clarify/stats."

---
# Grafana dashboard auto-provisioned by the kube-prometheus-stack sidecar
# (label grafana_dashboard=1 triggers import).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mobility-bot-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    app: mobility-bot
data:
  mobility-bot.json: |
    {
      "title": "MobilityOne Bot",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["mobility-bot"],
      "panels": [
        {
          "id": 1,
          "title": "HTTP p95 latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
            "legendFormat": "p95"
          }]
        },
        {
          "id": 2,
          "title": "LLM p95 latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m]))",
            "legendFormat": "p95"
          }]
        },
        {
          "id": 3,
          "title": "LLM error rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "rate(llm_requests_total{status=~\"error|timeout\"}[5m]) / rate(llm_requests_total[5m])",
            "legendFormat": "error rate"
          }]
        },
        {
          "id": 4,
          "title": "LLM cost ($/day trailing)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "increase(llm_cost_usd_total[24h])"}]
        },
        {
          "id": 5,
          "title": "Circuit breaker",
          "type": "stat",
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "llm_circuit_breaker_open"}]
        },
        {
          "id": 6,
          "title": "Routing decisions / min",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "rate(routing_decisions_total[5m]) * 60", "legendFormat": "decisions"},
            {"expr": "rate(routing_clarify_total[5m]) * 60", "legendFormat": "clarify"}
          ]
        },
        {
          "id": 7,
          "title": "FAISS search duration (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "histogram_quantile(0.95, rate(faiss_search_duration_bucket[5m]))",
            "legendFormat": "p95"
          }]
        }
      ]
    }
