# =============================================================================
# MobilityOne WhatsApp Bot — ConfigMap (non-sensitive values only).
# Secrets live in sealed-secrets.yaml.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: mobility-config
  labels:
    app: mobility-bot
data:
  # --- Application ---
  APP_ENV: "production"
  APP_NAME: "MobilityOne Bot"
  LOG_LEVEL: "WARNING"

  # --- Database ---
  # Single pod × (pool + overflow) = 1 × (10 + 20) = 30 connections peak.
  # Well under Postgres default max_connections=100 — no PgBouncer required.
  # If DB is shared with other workloads, prefer PgBouncer anyway.
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_RECYCLE: "3600"

  # --- Redis ---
  REDIS_MAX_CONNECTIONS: "50"
  REDIS_STREAM_MAXLEN: "10000"

  # --- AI orchestration ---
  AI_MAX_ITERATIONS: "6"
  AI_TEMPERATURE: "0.2"
  AI_MAX_TOKENS: "1500"
  MAX_TOOLS_FOR_LLM: "25"

  # --- Worker concurrency (single pod) ---
  MAX_CONCURRENT: "10"
  BURST_IDLE_TIMEOUT: "300"

  # --- Rate limiting ---
  RATE_LIMIT_PER_MINUTE: "20"
  RATE_LIMIT_WINDOW: "60"

  # --- Cache TTLs ---
  CACHE_TTL_TOKEN: "3500"
  CACHE_TTL_USER: "300"
  CACHE_TTL_CONTEXT: "86400"
  CACHE_TTL_TOOLS: "3600"

  # --- Azure OpenAI (deployment identifiers, not secrets) ---
  AZURE_OPENAI_API_VERSION: "2024-08-01-preview"
  AZURE_OPENAI_DEPLOYMENT_NAME: "gpt-4o-mini"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-ada-002"

  # --- Cost tracking ---
  LLM_INPUT_PRICE_PER_1K: "0.00015"
  LLM_OUTPUT_PRICE_PER_1K: "0.0006"
  DAILY_COST_BUDGET_USD: "50.0"

  # --- Drift detection ---
  DRIFT_BASELINE_DAYS: "7"
  DRIFT_ANALYSIS_HOURS: "6"
  DRIFT_MIN_SAMPLES: "50"
