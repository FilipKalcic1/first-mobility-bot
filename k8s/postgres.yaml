# In-cluster Postgres for user_mappings + audit tables.
#
# RECOMMENDED FOR REAL PRODUCTION: a managed database (Azure Database for
# PostgreSQL Flexible Server) instead of this StatefulSet — managed backups,
# PITR, patching. To switch: delete this file from kustomization.yaml and
# point DATABASE_URL in bot-secrets at the managed host. This manifest is
# correct and persistent, but backups are YOUR responsibility with it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mobility-bot
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mobility_bot
            - name: POSTGRES_USER
              value: bot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bot", "-d", "mobility_bot"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bot", "-d", "mobility_bot"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mobility-bot
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
