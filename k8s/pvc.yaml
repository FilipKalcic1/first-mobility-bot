# =============================================================================
# Embeddings cache PVC — persists .cache/tool_embeddings.json between pod
# restarts so startup drops from ~120s (regenerate all embeddings from Azure)
# to <5s (load from disk).
#
# Single pod → ReadWriteOnce is sufficient; no need for RWX storage class.
# =============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mobility-cache-pvc
  labels:
    app: mobility-bot
    component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi  # ~40Mi embeddings + headroom for future indices
  # Pick the default block-storage class for your cluster (examples):
  #   Azure AKS: managed-csi / managed-premium
  #   AWS EKS:   gp3
  #   GCP GKE:   standard-rwo / premium-rwo
  #   On-prem:   local-path (k3s) or your CSI default
  # Omit storageClassName to use the cluster default.
