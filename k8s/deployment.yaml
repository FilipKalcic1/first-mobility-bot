# =============================================================================
# MobilityOne WhatsApp Bot — Single-Pod Deployment
#
# CONSTRAINT: 1 replica, 1 CPU limit, 1 GiB memory limit for the whole Pod.
#
# DESIGN:
# - One Pod with two sidecar containers (api + worker) sharing localhost +
#   the embeddings cache PVC. No horizontal scaling, no KEDA.
# - API exposes :8000 for Infobip webhooks; worker is background-only.
# - Migration runs as a separate Job (one-shot). The Deployment does NOT
#   gate on it — apply the Job, wait for completion, then roll the Deployment.
#
# BUDGET (measured docker stats 2026-03-18 + headroom):
#   requests:  api 50m/350Mi  + worker 50m/350Mi  = 100m / 700Mi
#   limits:    api 400m/400Mi + worker 500m/500Mi = 900m / 900Mi
# Both stay below the Pod ceiling (1000m / 1024Mi) with ~12% headroom for
# kubelet/sidecar overhead.
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobility-bot
  labels:
    app: mobility-bot
spec:
  replicas: 1
  strategy:
    type: Recreate  # Single replica + RWO PVC — rolling update would deadlock on volume attach.
  selector:
    matchLabels:
      app: mobility-bot
  template:
    metadata:
      labels:
        app: mobility-bot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      terminationGracePeriodSeconds: 120  # Worker drains in-flight messages (90s timeout + 30s buffer)

      containers:
        # -----------------------------------------------------------------
        # API container — FastAPI on :8000, receives Infobip webhooks
        # -----------------------------------------------------------------
        - name: api
          image: ghcr.io/mobilityone/bot:latest
          imagePullPolicy: Always
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SERVICE_TYPE
              value: "api"
          envFrom:
            - secretRef:
                name: mobility-secrets
            - configMapRef:
                name: mobility-config
          resources:
            requests:
              cpu: "50m"
              memory: "350Mi"
            limits:
              cpu: "400m"
              memory: "400Mi"
          volumeMounts:
            - name: cache-volume
              mountPath: /app/.cache
            - name: tmp-api
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

        # -----------------------------------------------------------------
        # Worker container — consumes whatsapp_stream_inbound
        # -----------------------------------------------------------------
        - name: worker
          image: ghcr.io/mobilityone/bot:latest
          imagePullPolicy: Always
          command: ["python", "worker.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_TYPE
              value: "worker"
          envFrom:
            - secretRef:
                name: mobility-secrets
            - configMapRef:
                name: mobility-config
          resources:
            requests:
              cpu: "50m"
              memory: "350Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
          volumeMounts:
            - name: cache-volume
              mountPath: /app/.cache
            - name: tmp-worker
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'python -c "import os,redis; r=redis.from_url(os.environ[\"REDIS_URL\"]); r.ping(); r.close()"'
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'python -c "import os,redis; r=redis.from_url(os.environ[\"REDIS_URL\"]); r.ping(); r.close()"'
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: mobility-cache-pvc
        - name: tmp-api
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        - name: tmp-worker
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi  # DLQ fallback file when Redis is down

---
# =============================================================================
# DB MIGRATION JOB — apply first, wait for completion, then roll the Deployment:
#   kubectl apply -f k8s/deployment.yaml
#   kubectl wait --for=condition=complete --timeout=5m job/mobility-db-migrate
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mobility-db-migrate
  labels:
    app: mobility-bot
    component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: mobility-bot
        component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/mobilityone/bot:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alembic", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: mobility-secrets
            - configMapRef:
                name: mobility-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
