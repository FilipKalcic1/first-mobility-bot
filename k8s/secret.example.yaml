# TEMPLATE ONLY — never commit real values. Create the real secret with:
#
#   kubectl -n mobility-bot create secret generic bot-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://bot:<PASS>@postgres.mobility-bot.svc.cluster.local:5432/mobility_bot' \
#     --from-literal=MOBILITY_API_URL='https://<m1-host>' \
#     --from-literal=MOBILITY_AUTH_URL='https://<m1-host>/sso/connect/token' \
#     --from-literal=MOBILITY_CLIENT_ID='<id>' \
#     --from-literal=MOBILITY_CLIENT_SECRET='<secret>' \
#     --from-literal=MOBILITY_TENANT_ID='<dev-tenant-uuid>' \
#     --from-literal=AZURE_OPENAI_ENDPOINT='https://<resource>.openai.azure.com' \
#     --from-literal=AZURE_OPENAI_API_KEY='<key>' \
#     --from-literal=INFOBIP_API_KEY='<key>' \
#     --from-literal=INFOBIP_SECRET_KEY='<webhook-hmac-secret>' \
#     --from-literal=INFOBIP_SENDER_NUMBER='<whatsapp-sender-msisdn>' \
#     --from-literal=VIBER_SENDER='<viber-sender-ime>' \
#     --from-literal=ADMIN_TOKEN_1='<long-random>' \
#     --from-literal=ADMIN_TOKEN_1_USER='filip.kalcic' \
#     --from-literal=POSTGRES_PASSWORD='<PASS>'
#
# (POSTGRES_PASSWORD is only read by the in-cluster postgres.yaml; skip it
# when using a managed database.)
#
# This file exists so the expected keys are documented next to the
# manifests. It is intentionally NOT listed in kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: bot-secrets
  namespace: mobility-bot
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://bot:CHANGE_ME@postgres.mobility-bot.svc.cluster.local:5432/mobility_bot"
  MOBILITY_API_URL: "https://CHANGE_ME"
  MOBILITY_AUTH_URL: "https://CHANGE_ME/sso/connect/token"
  MOBILITY_CLIENT_ID: "CHANGE_ME"
  MOBILITY_CLIENT_SECRET: "CHANGE_ME"
  MOBILITY_TENANT_ID: "CHANGE_ME"
  AZURE_OPENAI_ENDPOINT: "https://CHANGE_ME.openai.azure.com"
  AZURE_OPENAI_API_KEY: "CHANGE_ME"
  INFOBIP_API_KEY: "CHANGE_ME"
  INFOBIP_SECRET_KEY: "CHANGE_ME"
  INFOBIP_SENDER_NUMBER: "CHANGE_ME"
  # Opcionalno — Viber BM sender IME (registrirano kod Infobipa).
  # Bez njega Viber kanal je isključen (poruke → DLQ VIBER_NOT_CONFIGURED).
  VIBER_SENDER: ""
  ADMIN_TOKEN_1: "CHANGE_ME"
  ADMIN_TOKEN_1_USER: "filip.kalcic"
  POSTGRES_PASSWORD: "CHANGE_ME"
