# =============================================================================
# Services, Ingress, and NetworkPolicy for single-pod deployment.
#
# Only the API container exposes a port. Worker is background-only.
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: mobility-api
  labels:
    app: mobility-bot
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: metrics   # ServiceMonitor scrapes this named port
  selector:
    app: mobility-bot

---
# Redis Service — switch to ExternalName when using managed Redis.
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis

---
# Ingress — Infobip webhooks terminate here over TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mobility-api
  labels:
    app: mobility-bot
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"     # Matches MAX_REQUEST_BODY_BYTES in main.py
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bot.mobilityone.example
      secretName: mobility-api-tls
  rules:
    - host: bot.mobilityone.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mobility-api
                port:
                  number: 80

---
# NetworkPolicy — default-deny, explicit allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mobility-bot
spec:
  podSelector:
    matchLabels:
      app: mobility-bot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller may reach :8000 for webhook traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP
    # kube-prometheus-stack scrapes /metrics on :8000 from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Redis (in-cluster)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    # Postgres, Azure OpenAI, MobilityOne API — external HTTPS + Postgres
    - ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP  # PgBouncer
