# =============================================================================
# MobilityOne WhatsApp Bot - Unified Docker Compose
#
# ARCHITECTURE:
# - bot_net: Bot API + Worker (public facing)
# - db_net:  PostgreSQL + Redis (shared)
#
# SECURITY:
# - bot_user:   Limited DB access (cannot read audit_logs, hallucination_reports)
# - admin_user: Full DB access, used only by migrations
#
# USAGE:
#   docker-compose up -d
# =============================================================================

services:
  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # --- PostgreSQL (Dual-User Security) ---
  postgres:
    image: postgres:15-alpine
    container_name: mobility_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super_tajna_lozinka}
      POSTGRES_DB: mobility_db
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:-bot_password_123}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_password_456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d mobility_db"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - db_net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # --- PgBouncer (Connection Pooling) ---
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: mobility_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://appuser:${DB_PASSWORD:-super_tajna_lozinka}@postgres:5432/mobility_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 50
      DEFAULT_POOL_SIZE: 10
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      AUTH_TYPE: plain
      # Allow bot_user and admin_user through PgBouncer
      AUTH_USER: appuser
      # CRITICAL: Must match Docker port mapping (default is 5432, we need 6432)
      LISTEN_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - db_net
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: mobility_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - db_net

  # ===========================================================================
  # MIGRATIONS (runs with admin_user)
  # ===========================================================================
  migration:
    build: .
    container_name: mobility_migration
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql://admin_user:${ADMIN_DB_PASSWORD:-admin_password_456}@postgres:5432/mobility_db
      - ADMIN_DATABASE_URL=postgresql://admin_user:${ADMIN_DB_PASSWORD:-admin_password_456}@postgres:5432/mobility_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net
    restart: "no"

  # ===========================================================================
  # APPLICATION LAYER
  # ===========================================================================

  # --- Bot API (Public Facing) ---
  api:
    build: .
    container_name: mobility_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # BOT uses limited user!
      - DATABASE_URL=postgresql+asyncpg://bot_user:${BOT_DB_PASSWORD:-bot_password_123}@postgres:5432/mobility_db
      - BOT_DATABASE_URL=postgresql+asyncpg://bot_user:${BOT_DB_PASSWORD:-bot_password_123}@postgres:5432/mobility_db
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=bot
    volumes:
      - cache_data:/app/.cache:rw
      - models_data:/app/models:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    labels:
      - "autoheal=true"
    networks:
      - bot_net
      - db_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # Log rotation (FAZA P1.3 Filip 2026-05-19): cap container stdout to
    # prevent disk fill on long-running deploys. JSON driver is the default
    # but max-size/max-file are NOT — explicitly set them.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Worker (Background Tasks) ---
  worker:
    build: .
    container_name: mobility_worker
    restart: unless-stopped
    command: python worker.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bot_user:${BOT_DB_PASSWORD:-bot_password_123}@postgres:5432/mobility_db
      - BOT_DATABASE_URL=postgresql+asyncpg://bot_user:${BOT_DB_PASSWORD:-bot_password_123}@postgres:5432/mobility_db
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=bot
      # HIGH-3 (Filip 2026-05-29): tracemalloc enabled briefly during audit
      # showed actual RAM growth far exceeds the "~3MB cost" claim — peaked
      # 100% of 2GB during anchor embed init. Disable for live test; re-enable
      # only when investigating a specific leak (or after raising mem to 4G).
      # - TRACEMALLOC=true
    volumes:
      - cache_data:/app/.cache:rw
      - models_data:/app/models:rw
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Redis connectivity check: verifies worker can reach its primary dependency.
      # Tuned to tolerate brief network blips: 3 consecutive failures × 30s = 90s before restart.
      test: ["CMD", "python", "-c", "import os,redis; r=redis.from_url(os.environ['REDIS_URL']); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "autoheal=true"
    networks:
      - bot_net
      - db_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    # Memory: 512M (orig) → 1G (2026-05-28) → 2G (2026-05-29 audit retest):
    # with TRACEMALLOC=true + anchor cache miss + 11k phrase embed peak hits
    # 99% of 1GB. 2G gives safe headroom + tracemalloc top5 still affordable.
    # After steady-state, worker uses ~400-600MB; peak is during cold-init.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # RELIABILITY
  # ===========================================================================

  # --- Autoheal ---
  autoheal:
    image: willfarrell/autoheal
    container_name: mobility_autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bot_net

  # ===========================================================================
  # AUTOSCALER REMOVED - Will use Kubernetes KEDA for production scaling
  # See: k8s/keda-autoscaler.yaml
  # For Docker Compose, manually scale with: docker-compose up -d --scale worker=N
  # ===========================================================================

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  # Public facing network (Bot API, Worker)
  bot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

  # Database network (shared)
  db_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  cache_data:
    driver: local
  models_data:
    driver: local
