# Prometheus alert rules for the MobilityOne WhatsApp bot.
#
# Only includes alerts backed by metrics the bot actually exports
# (see services/ai_orchestrator.py, services/unified_router.py,
# services/faiss_vector_store.py, main.py).
#
# Alerts that required redis_exporter / cAdvisor / blackbox-exporter were
# removed — add them back alongside the exporters if you deploy them.

groups:
  - name: bot_availability
    rules:
      - alert: BotAPIDown
        expr: up{job="mobility-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bot API is down"
          description: "Bot API has been unreachable for over 1 minute."

  - name: bot_performance
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency exceeds 10 seconds"
          description: "95th percentile response time: {{ $value }}s"

      - alert: HighLLMLatency
        expr: histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m])) > 15
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "LLM p95 latency exceeds 15 seconds"
          description: "95th percentile LLM call time: {{ $value }}s"

      - alert: HighLLMErrorRate
        expr: rate(llm_requests_total{status=~"error|timeout"}[5m]) / rate(llm_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM error rate exceeds 10%"
          description: "Error rate: {{ $value | humanizePercentage }}"

      - alert: LLMCircuitBreakerOpen
        expr: llm_circuit_breaker_open == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM circuit breaker is OPEN - AI unavailable"

      - alert: HighRateLimitHits
        expr: rate(llm_rate_limit_hits_total[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Frequent LLM rate limit hits"
          description: "Rate: {{ $value }}/s"

  - name: bot_cost
    rules:
      - alert: DailyCostBudgetExceeded
        expr: increase(llm_cost_usd_total[24h]) > 50
        labels:
          severity: warning
        annotations:
          summary: "Daily LLM cost budget exceeded ($50)"
          description: "Current daily cost: ${{ $value | humanize }}"

      - alert: CostSpike
        expr: rate(llm_cost_usd_total[1h]) * 24 > 100
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "LLM cost spike detected - projected >$100/day"
          description: "Projected daily cost: ${{ $value | humanize }}"

  - name: bot_routing
    rules:
      - alert: HighClarifyRate
        expr: |
          (
            rate(routing_clarify_total[1h])
            / on() rate(routing_decisions_total[1h])
          ) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clarify action rate >20% in the last hour"
          description: >
            {{ $value | humanizePercentage }} of routing decisions resulted in
            clarify actions. Users may be using vocabulary that the entity
            detector does not recognize. Check /admin/clarify/log for details.

      - alert: SustainedHighClarifyRate
        expr: |
          (
            rate(routing_clarify_total[6h])
            / on() rate(routing_decisions_total[6h])
          ) > 0.15
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Sustained clarify rate >15% over 6 hours"
          description: >
            Clarify rate has been above 15% for 30+ minutes over a 6-hour
            window. This may indicate a regression in entity detection or
            a shift in user vocabulary. Investigate via /admin/clarify/stats.
