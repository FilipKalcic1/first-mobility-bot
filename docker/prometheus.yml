# Prometheus configuration for the MobilityOne WhatsApp bot.
# Only scrapes what actually exists: the API container exposes /metrics on :8000
# (see main.py — guarded by admin token in production).
#
# If you later add Redis metrics, install redis_exporter as a sidecar and add a
# job here. Same for cAdvisor / node-exporter / blackbox-exporter.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: 'mobility-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 10s
